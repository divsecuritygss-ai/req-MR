<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meeting Room Hub & Management</title>
    <style>
        :root {
            --bg-dark: #07090e;
            --surface-card: rgba(18, 24, 38, 0.65);
            --surface-card-hover: rgba(28, 36, 56, 0.75);
            --border-glow: rgba(255, 255, 255, 0.08);
            --accent-blue: #3b82f6;
            --accent-blue-glow: rgba(59, 130, 246, 0.35);
            --accent-emerald: #10b981;
            --accent-emerald-glow: rgba(16, 185, 129, 0.35);
            --accent-rose: #f43f5e;
            --accent-rose-glow: rgba(244, 63, 94, 0.35);
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.12), transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.05), transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.25rem 1rem;
        }

        /* Floating Segmented Control */
        .segmented-control {
            display: flex;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            padding: 5px;
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .segment-btn {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.825rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .segment-btn.active {
            background: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 4px 16px var(--accent-blue-glow);
        }

        /* Main Glass Card Container */
        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--surface-card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 1.75rem;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
        }

        .header-title {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-sub {
            font-size: 0.825rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-glow);
        }

        /* Room Cards */
        .room-card {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--border-glow);
            border-radius: 18px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .room-card:hover {
            background: var(--surface-card-hover);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .room-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .room-name {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .room-meta {
            font-size: 0.825rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .room-facilities {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Status Badges with Pulsing Dot */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .badge-available {
            background: rgba(16, 185, 129, 0.12);
            color: var(--accent-emerald);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .badge-occupied {
            background: rgba(244, 63, 94, 0.12);
            color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.25);
        }

        .badge-maintenance {
            background: rgba(245, 158, 11, 0.12);
            color: var(--accent-amber);
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 10px currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Sleek Micro Buttons */
        .btn {
            padding: 0.65rem 1.1rem;
            border: none;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 4px 14px var(--accent-blue-glow);
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-emerald {
            background: var(--accent-emerald);
            color: #ffffff;
            box-shadow: 0 4px 14px var(--accent-emerald-glow);
        }

        .btn-rose {
            background: rgba(244, 63, 94, 0.15);
            color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-glow);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Stats Header for Admin */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 0.85rem;
            text-align: center;
        }

        .stat-label { font-size: 0.725rem; color: var(--text-sub); }
        .stat-val { font-size: 1.3rem; font-weight: 800; margin-top: 2px; }

        /* Modal Overlays */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(12px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-box {
            background: #0f172a;
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 1.75rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label { font-size: 0.8rem; color: var(--text-sub); font-weight: 500; }
        .form-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus { border-color: var(--accent-blue); }
    </style>
</head>
<body>

    <!-- Floating Navigation Tabs -->
    <nav class="segmented-control">
        <button class="segment-btn active" onclick="switchTab('karyawan', this)">📱 Karyawan</button>
        <button class="segment-btn" onclick="switchTab('tablet', this)">🖥️ Tablet Display</button>
        <button class="segment-btn" onclick="switchTab('admin', this)">⚙️ Admin Panel</button>
    </nav>

    <!-- Main Card App -->
    <main class="app-container">
        
        <!-- 1. KARYAWAN VIEW -->
        <section id="viewKaryawan">
            <header class="section-header">
                <div>
                    <h1 class="header-title">Ruang Meeting</h1>
                    <p class="header-sub">Status & Check-in Realtime Kantor</p>
                </div>
            </header>
            <div id="karyawanList"></div>
        </section>

        <!-- 2. TABLET DISPLAY KIOSK VIEW -->
        <section id="viewTablet" style="display: none;">
            <header class="section-header">
                <div>
                    <h1 class="header-title">Tablet Pintu Display</h1>
                    <p class="header-sub">Mode Kiosk Layar Ruangan</p>
                </div>
                <select id="tabletRoomSelect" class="form-input" onchange="renderTabletDisplay()" style="width: auto; padding: 6px 10px;">
                </select>
            </header>
            <div id="tabletDisplayArea" style="text-align: center; padding: 2rem 0;"></div>
        </section>

        <!-- 3. ADMIN MANAGEMENT VIEW -->
        <section id="viewAdmin" style="display: none;">
            <header class="section-header">
                <div>
                    <h1 class="header-title">Kelola Ruangan</h1>
                    <p class="header-sub">Dashboard Manajemen Ruangan</p>
                </div>
                <button class="btn btn-primary" onclick="openAddModal()">+ Ruang Baru</button>
            </header>

            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-label">Total Ruang</div>
                    <div id="statTotal" class="stat-val">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Tersedia</div>
                    <div id="statAvailable" class="stat-val" style="color: var(--accent-emerald);">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Terpakai</div>
                    <div id="statOccupied" class="stat-val" style="color: var(--accent-rose);">0</div>
                </div>
            </div>

            <div id="adminList"></div>
        </section>

    </main>

    <!-- MODAL FORM (ADD/EDIT ROOM) -->
    <div id="roomModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle" class="header-title" style="margin-bottom: 1.25rem;">Tambah Ruang Meeting</h3>
            <form id="roomForm" onsubmit="saveRoomData(event)">
                <input type="hidden" id="roomId">
                <div class="form-group">
                    <label>Nama Ruangan</label>
                    <input type="text" id="roomName" class="form-input" placeholder="Contoh: Executive Boardroom" required>
                </div>
                <div class="form-group">
                    <label>Lokasi / Lantai</label>
                    <input type="text" id="roomLocation" class="form-input" placeholder="Contoh: Lantai 4 - Wing West" required>
                </div>
                <div class="form-group">
                    <label>Kapasitas (Orang)</label>
                    <input type="number" id="roomCapacity" class="form-input" placeholder="12" required>
                </div>
                <div class="form-group">
                    <label>Fasilitas Utama</label>
                    <input type="text" id="roomFacilities" class="form-input" placeholder="TV 65 inch, Wireless Mic, Whiteboard">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-ghost" style="flex: 1;" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- REALTIME BROADCAST & ENGINE -->
    <script>
        const syncChannel = new BroadcastChannel('meeting_hub_channel');
        
        const defaultRooms = [
            { id: '1', name: 'Innovation 01', location: 'Lantai 3', capacity: 10, status: 'AVAILABLE', facilities: 'TV 65", Whiteboard' },
            { id: '2', name: 'Executive Room', location: 'Lantai 4', capacity: 20, status: 'OCCUPIED', facilities: 'Video Conf, Microphones' },
            { id: '3', name: 'Brainstorm Pod', location: 'Lantai 2', capacity: 4, status: 'MAINTENANCE', facilities: 'Smart Display' }
        ];

        let rooms = JSON.parse(localStorage.getItem('meeting_rooms')) || defaultRooms;

        function persistData() {
            localStorage.setItem('meeting_rooms', JSON.stringify(rooms));
            syncChannel.postMessage({ type: 'DATA_SYNC' });
            renderViews();
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById('viewKaryawan').style.display = tabName === 'karyawan' ? 'block' : 'none';
            document.getElementById('viewTablet').style.display = tabName === 'tablet' ? 'block' : 'none';
            document.getElementById('viewAdmin').style.display = tabName === 'admin' ? 'block' : 'none';

            renderViews();
        }

        function renderViews() {
            renderKaryawan();
            renderTabletSelect();
            renderTabletDisplay();
            renderAdmin();
        }

        function renderKaryawan() {
            const list = document.getElementById('karyawanList');
            list.innerHTML = rooms.map(room => `
                <article class="room-card">
                    <div class="room-card-top">
                        <div>
                            <h2 class="room-name">${room.name}</h2>
                            <p class="room-meta">${room.location} • Kapasitas ${room.capacity} Orang</p>
                        </div>
                        <span class="status-badge badge-${room.status.toLowerCase()}">
                            <span class="pulse-dot"></span> ${room.status}
                        </span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
                        <div class="room-facilities">💻 ${room.facilities}</div>
                        ${room.status !== 'MAINTENANCE' ? `
                            <button class="btn ${room.status === 'AVAILABLE' ? 'btn-primary' : 'btn-ghost'}" onclick="toggleStatus('${room.id}')">
                                ${room.status === 'AVAILABLE' ? 'Scan Check-In' : 'Selesaikan'}
                            </button>
                        ` : ''}
                    </div>
                </article>
            `).join('');
        }

        function renderTabletSelect() {
            const select = document.getElementById('tabletRoomSelect');
            select.innerHTML = rooms.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
        }

        function renderTabletDisplay() {
            const selectedId = document.getElementById('tabletRoomSelect').value || (rooms[0] && rooms[0].id);
            const room = rooms.find(r => r.id === selectedId);
            const area = document.getElementById('tabletDisplayArea');

            if (!room) {
                area.innerHTML = '<p style="color: var(--text-sub);">Belum ada data ruangan.</p>';
                return;
            }

            area.innerHTML = `
                <h2 style="font-size: 2.25rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.25rem;">${room.name}</h2>
                <p style="color: var(--text-sub); font-size: 0.9rem; margin-bottom: 2rem;">${room.location} — Max ${room.capacity} Orang</p>
                
                <div style="margin-bottom: 2.5rem;">
                    <span class="status-badge badge-${room.status.toLowerCase()}" style="font-size: 1.25rem; padding: 12px 32px; border-radius: 30px;">
                        <span class="pulse-dot" style="width: 12px; height: 12px;"></span> ${room.status}
                    </span>
                </div>

                <button class="btn ${room.status === 'AVAILABLE' ? 'btn-emerald' : 'btn-rose'}" onclick="toggleStatus('${room.id}')" style="font-size: 1rem; padding: 14px 28px; width: 100%; max-width: 300px;">
                    ${room.status === 'AVAILABLE' ? 'Tap QR Check-In Status' : 'Tap Akhiri Penggunaan'}
                </button>
            `;
        }

        function renderAdmin() {
            document.getElementById('statTotal').innerText = rooms.length;
            document.getElementById('statAvailable').innerText = rooms.filter(r => r.status === 'AVAILABLE').length;
            document.getElementById('statOccupied').innerText = rooms.filter(r => r.status === 'OCCUPIED').length;

            const list = document.getElementById('adminList');
            list.innerHTML = rooms.map(room => `
                <article class="room-card" style="padding: 1rem 1.25rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h3 class="room-name" style="font-size: 1rem;">${room.name}</h3>
                            <p class="room-meta" style="font-size: 0.775rem;">${room.location} | Cap: ${room.capacity}</p>
                        </div>
                        <div style="display: flex; gap: 6px;">
                            <button class="btn btn-ghost" style="padding: 6px 10px; font-size: 0.75rem;" onclick="toggleMaintenance('${room.id}')">
                                ${room.status === 'MAINTENANCE' ? 'Aktifkan' : 'Maintenance'}
                            </button>
                            <button class="btn btn-ghost" style="padding: 6px 10px; font-size: 0.75rem;" onclick="openEditModal('${room.id}')">Edit</button>
                            <button class="btn btn-rose" style="padding: 6px 10px; font-size: 0.75rem;" onclick="deleteRoom('${room.id}')">Hapus</button>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function toggleStatus(id) {
            rooms = rooms.map(r => r.id === id ? { ...r, status: r.status === 'AVAILABLE' ? 'OCCUPIED' : 'AVAILABLE' } : r);
            persistData();
        }

        function toggleMaintenance(id) {
            rooms = rooms.map(r => r.id === id ? { ...r, status: r.status === 'MAINTENANCE' ? 'AVAILABLE' : 'MAINTENANCE' } : r);
            persistData();
        }

        function deleteRoom(id) {
            if (confirm('Hapus ruang meeting ini?')) {
                rooms = rooms.filter(r => r.id !== id);
                persistData();
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = 'Tambah Ruang Meeting';
            document.getElementById('roomId').value = '';
            document.getElementById('roomForm').reset();
            document.getElementById('roomModal').style.display = 'flex';
        }

        function openEditModal(id) {
            const room = rooms.find(r => r.id === id);
            if (!room) return;
            document.getElementById('modalTitle').innerText = 'Edit Ruang Meeting';
            document.getElementById('roomId').value = room.id;
            document.getElementById('roomName').value = room.name;
            document.getElementById('roomLocation').value = room.location;
            document.getElementById('roomCapacity').value = room.capacity;
            document.getElementById('roomFacilities').value = room.facilities;
            document.getElementById('roomModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('roomModal').style.display = 'none';
        }

        function saveRoomData(e) {
            e.preventDefault();
            const id = document.getElementById('roomId').value;
            const name = document.getElementById('roomName').value;
            const location = document.getElementById('roomLocation').value;
            const capacity = parseInt(document.getElementById('roomCapacity').value);
            const facilities = document.getElementById('roomFacilities').value;

            if (id) {
                rooms = rooms.map(r => r.id === id ? { ...r, name, location, capacity, facilities } : r);
            } else {
                rooms.push({ id: Date.now().toString(), name, location, capacity, facilities, status: 'AVAILABLE' });
            }

            persistData();
            closeModal();
        }

        syncChannel.onmessage = (event) => {
            if (event.data.type === 'DATA_SYNC') {
                rooms = JSON.parse(localStorage.getItem('meeting_rooms')) || defaultRooms;
                renderViews();
            }
        };

        renderViews();
    </script>
</body>
</html>
