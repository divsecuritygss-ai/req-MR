<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meeting Room Hub - Enterprise Dashboard</title>
    <style>
        :root {
            --bg-main: #080b11;
            --card-bg: rgba(15, 22, 35, 0.75);
            --card-inner: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.18);
            --accent-blue: #2563eb;
            --accent-blue-bright: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.08), transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(16, 185, 129, 0.04), transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        /* Container Layout Adaptif */
        .app-viewport {
            width: 100%;
            max-width: 1280px; /* Lebar maksimal laptop/desktop */
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin: 0 auto;
        }

        /* Navigation Header Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 22, 35, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 0.85rem 1.25rem;
            border-radius: 18px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .status-pill-engine {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.725rem;
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .dot-pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border-highlight);
        }

        .btn-primary-action {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        /* Stats Grid Dashboard */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-value {
            font-size: 1.85rem;
            font-weight: 800;
        }

        /* Controls Bar (Filter & Add) */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--accent-blue);
            color: white;
        }

        /* Main Room Cards Grid */
        .rooms-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        .room-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
            transition: transform 0.2s, border-color 0.2s;
        }

        .room-card:hover {
            border-color: var(--border-highlight);
        }

        .room-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .location-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge.occupied {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-badge.available {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.maintenance {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .room-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .room-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .active-meeting-panel {
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .btn-full {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-blue { background: var(--accent-blue); color: white; }
        .btn-ghost { background: rgba(255, 255, 255, 0.08); color: white; }
        .btn-warning { background: rgba(245, 158, 11, 0.2); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.4); }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4); }

        /* Modal Security PIN & Form */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-box {
            background: #111827;
            border: 1px solid var(--border-highlight);
            border-radius: 20px;
            padding: 1.75rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            margin-top: 4px;
        }

        .form-input:focus { border-color: var(--accent-blue-bright); }

        /* RESPONSIVE MEDIA QUERIES (HP -> TABLET -> LAPTOP) */
        @media (min-width: 640px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (min-width: 768px) {
            .rooms-grid {
                grid-template-columns: repeat(2, 1fr); /* Tablet 2 Kolom Grid */
            }
        }

        @media (min-width: 1024px) {
            .rooms-grid {
                grid-template-columns: repeat(3, 1fr); /* Laptop / PC 3 Kolom Grid */
            }
            .app-viewport {
                padding: 1rem 0;
            }
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        
        <!-- Navbar Header Utama -->
        <header class="navbar">
            <div class="nav-brand">
                <span class="brand-title">Meeting Hub</span>
                <span class="status-pill-engine">
                    <span class="dot-pulse"></span> SYNC ACTIVE
                </span>
            </div>
            <div class="nav-actions">
                <button class="btn-action" onclick="forceSyncState()">⚡ Sync</button>
                <button id="adminAccessBtn" class="btn-action" onclick="handleAdminAuth()">🔒 Admin Mode</button>
                <button class="btn-action btn-primary-action" onclick="triggerScan()">📷 Scan QR</button>
            </div>
        </header>

        <!-- Stats Grid Summary Dashboard -->
        <section class="stats-grid">
            <div class="stat-card">
                <span class="stat-title">Ruang Tersedia</span>
                <span id="statTersedia" class="stat-value" style="color: var(--accent-green);">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Sedang Dipakai</span>
                <span id="statDipakai" class="stat-value" style="color: var(--accent-red);">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Maintenance</span>
                <span id="statMaintenance" class="stat-value" style="color: var(--accent-amber);">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Total Ruangan</span>
                <span id="statTotal" class="stat-value">0</span>
            </div>
        </section>

        <!-- Controls Bar (Filter & Admin Action) -->
        <section class="controls-bar">
            <div class="filter-group">
                <button class="filter-btn active" onclick="setFilter('ALL', this)">Semua</button>
                <button class="filter-btn" onclick="setFilter('AVAILABLE', this)">Tersedia</button>
                <button class="filter-btn" onclick="setFilter('OCCUPIED', this)">Dipakai</button>
                <button class="filter-btn" onclick="setFilter('MAINTENANCE', this)">Maintenance</button>
            </div>
            <div id="adminActionGroup" style="display: none;">
                <button class="btn-action btn-primary-action" onclick="openAddRoomModal()">+ Tambah Ruangan Baru</button>
            </div>
        </section>

        <!-- Dynamic Responsive Room Grid -->
        <main class="rooms-grid" id="roomsContainer"></main>

    </div>

    <!-- MODAL PIN SECURITY FOR ADMIN MODE -->
    <div id="pinModal" class="modal-overlay">
        <div class="modal-box" style="text-align: center;">
            <h3 style="font-size: 1.25rem; font-weight: 700;">Keamanan Admin</h3>
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Masukkan PIN Default Kantor untuk Kelola Ruangan</p>
            <input type="password" id="pinInput" class="form-input" placeholder="••••" maxlength="4" style="text-align: center; font-size: 1.25rem; letter-spacing: 0.3em; margin: 1.25rem 0;">
            <button class="btn-full btn-blue" onclick="verifyAdminPin()">Masuk Admin</button>
            <button class="btn-full btn-ghost" style="margin-top: 8px;" onclick="closeModal('pinModal')">Batal</button>
        </div>
    </div>

    <!-- MODAL TAMBAH/EDIT RUANGAN -->
    <div id="roomModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle" style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1rem;">Tambah Ruang Meeting</h3>
            <form id="roomForm" onsubmit="saveRoomData(event)">
                <input type="hidden" id="roomId">
                <div style="margin-bottom: 12px;">
                    <label style="font-size: 0.8rem; color: var(--text-secondary);">Nama Ruangan</label>
                    <input type="text" id="roomName" class="form-input" required placeholder="Contoh: Titanium Room A">
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="font-size: 0.8rem; color: var(--text-secondary);">Lokasi (Lantai & Sayap)</label>
                    <input type="text" id="roomLocation" class="form-input" required placeholder="LANTAI 3 • SAYAP BARAT">
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="font-size: 0.8rem; color: var(--text-secondary);">Kapasitas (Orang)</label>
                    <input type="number" id="roomCapacity" class="form-input" required placeholder="12">
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="font-size: 0.8rem; color: var(--text-secondary);">Subjek Meeting Berlangsung (Opsional)</label>
                    <input type="text" id="meetingSubject" class="form-input" placeholder="Sprint Review & Planning Q3">
                </div>
                <div style="display: flex; gap: 8px;">
                    <button type="button" class="btn-full btn-ghost" onclick="closeModal('roomModal')">Batal</button>
                    <button type="submit" class="btn-full btn-blue">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Realtime Engine & Handlers -->
    <script>
        const syncChannel = new BroadcastChannel('meeting_hub_channel');
        const DEFAULT_PIN = "84L1";
        let isAdminMode = false;
        let activeFilter = 'ALL';

        const defaultRooms = [
            { id: '1', name: 'Titanium Room A', location: 'LANTAI 3 • SAYAP BARAT', capacity: 12, status: 'OCCUPIED', activeMeeting: 'Sprint Review & Planning Q3', pic: 'Rina Kurnia', time: '10:00 - 11:30 AM' },
            { id: '2', name: 'Innovation Pod 02', location: 'LANTAI 2 • SAYAP TIMUR', capacity: 6, status: 'AVAILABLE', activeMeeting: '', pic: '', time: '' },
            { id: '3', name: 'Executive Boardroom', location: 'LANTAI 4 • UTAMA', capacity: 20, status: 'AVAILABLE', activeMeeting: '', pic: '', time: '' },
            { id: '4', name: 'Creative Hub', location: 'LANTAI 1 • SELATAN', capacity: 8, status: 'MAINTENANCE', activeMeeting: '', pic: '', time: '' }
        ];

        let rooms = JSON.parse(localStorage.getItem('meeting_hub_rooms')) || defaultRooms;

        function saveDataAndSync() {
            localStorage.setItem('meeting_hub_rooms', JSON.stringify(rooms));
            syncChannel.postMessage({ type: 'DATA_SYNC' });
            renderDashboard();
        }

        function forceSyncState() {
            saveDataAndSync();
            alert('Realtime Engine berhasil disinkronisasi.');
        }

        /* Filter Control */
        function setFilter(filter, btn) {
            activeFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderDashboard();
        }

        /* Admin Authentication */
        function handleAdminAuth() {
            if (isAdminMode) {
                isAdminMode = false;
                document.getElementById('adminAccessBtn').innerText = '🔒 Admin Mode';
                document.getElementById('adminActionGroup').style.display = 'none';
                renderDashboard();
            } else {
                document.getElementById('pinInput').value = '';
                document.getElementById('pinModal').style.display = 'flex';
            }
        }

        function verifyAdminPin() {
            const input = document.getElementById('pinInput').value;
            if (input === DEFAULT_PIN) {
                isAdminMode = true;
                closeModal('pinModal');
                document.getElementById('adminAccessBtn').innerText = '🔓 Keluar Admin';
                document.getElementById('adminActionGroup').style.display = 'block';
                renderDashboard();
            } else {
                alert('PIN Salah! Gunakan PIN default "84L1".');
            }
        }

        /* Main Dashboard Render Logic */
        function renderDashboard() {
            // Stats Calculation
            const tersedia = rooms.filter(r => r.status === 'AVAILABLE').length;
            const dipakai = rooms.filter(r => r.status === 'OCCUPIED').length;
            const maintenance = rooms.filter(r => r.status === 'MAINTENANCE').length;

            document.getElementById('statTersedia').innerText = tersedia;
            document.getElementById('statDipakai').innerText = dipakai;
            document.getElementById('statMaintenance').innerText = maintenance;
            document.getElementById('statTotal').innerText = rooms.length;

            // Filter Rooms
            let filteredRooms = rooms;
            if (activeFilter !== 'ALL') {
                filteredRooms = rooms.filter(r => r.status === activeFilter);
            }

            const container = document.getElementById('roomsContainer');
            if (filteredRooms.length === 0) {
                container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-secondary);">Tidak ada ruangan dengan status ini.</div>`;
                return;
            }

            container.innerHTML = filteredRooms.map(room => `
                <article class="room-card">
                    <div>
                        <div class="room-card-header" style="margin-bottom: 0.75rem;">
                            <span class="location-tag">${room.location}</span>
                            <span class="status-badge ${room.status.toLowerCase()}">
                                • ${room.status === 'OCCUPIED' ? 'Dipakai' : room.status === 'AVAILABLE' ? 'Tersedia' : 'Maintenance'}
                            </span>
                        </div>
                        <h2 class="room-title">${room.name}</h2>
                        <p class="room-meta">Kapasitas Maksimal: ${room.capacity} orang</p>
                    </div>

                    ${room.status === 'OCCUPIED' ? `
                        <div class="active-meeting-panel">
                            <span style="font-size: 0.725rem; color: var(--text-secondary);">Meeting Berlangsung:</span>
                            <span style="font-size: 0.9rem; font-weight: 700;">${room.activeMeeting || 'Diskusi Tim'}</span>
                            <div style="display: flex; justify-content: space-between; font-size: 0.775rem; color: var(--text-secondary); margin-top: 4px;">
                                <span>👤 ${room.pic || 'Staf Kantor'}</span>
                                <span>🕒 ${room.time || '10:00 - 11:30 AM'}</span>
                            </div>
                        </div>
                    ` : ''}

                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        ${room.status !== 'MAINTENANCE' ? `
                            <button class="btn-full ${room.status === 'AVAILABLE' ? 'btn-blue' : 'btn-ghost'}" onclick="toggleRoomStatus('${room.id}')">
                                ${room.status === 'AVAILABLE' ? 'Check-In Ruangan' : 'Selesaikan Meeting'}
                            </button>
                        ` : '<button class="btn-full btn-ghost" disabled style="opacity: 0.5;">Sedang Maintenance</button>'}

                        ${isAdminMode ? `
                            <div style="display: flex; gap: 6px; margin-top: 4px;">
                                <button class="btn-full btn-warning" style="padding: 6px; font-size: 0.75rem;" onclick="toggleMaintenance('${room.id}')">
                                    ${room.status === 'MAINTENANCE' ? 'Aktifkan' : 'Set Maintenance'}
                                </button>
                                <button class="btn-full btn-danger" style="padding: 6px; font-size: 0.75rem;" onclick="deleteRoom('${room.id}')">Hapus</button>
                            </div>
                        ` : ''}
                    </div>
                </article>
            `).join('');
        }

        /* Status Controls & Maintenance Fix */
        function toggleRoomStatus(id) {
            rooms = rooms.map(r => {
                if (r.id === id) {
                    const next = r.status === 'AVAILABLE' ? 'OCCUPIED' : 'AVAILABLE';
                    return { ...r, status: next };
                }
                return r;
            });
            saveDataAndSync();
        }

        function toggleMaintenance(id) {
            rooms = rooms.map(r => {
                if (r.id === id) {
                    const nextStatus = r.status === 'MAINTENANCE' ? 'AVAILABLE' : 'MAINTENANCE';
                    return { ...r, status: nextStatus };
                }
                return r;
            });
            saveDataAndSync();
        }

        function deleteRoom(id) {
            if (confirm('Apakah Anda yakin ingin menghapus ruangan ini?')) {
                rooms = rooms.filter(r => r.id !== id);
                saveDataAndSync();
            }
        }

        /* Modal Handlers */
        function openAddRoomModal() {
            document.getElementById('roomForm').reset();
            document.getElementById('roomModal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function saveRoomData(e) {
            e.preventDefault();
            const name = document.getElementById('roomName').value;
            const location = document.getElementById('roomLocation').value;
            const capacity = parseInt(document.getElementById('roomCapacity').value);
            const activeMeeting = document.getElementById('meetingSubject').value;

            rooms.push({
                id: Date.now().toString(),
                name,
                location,
                capacity,
                status: 'AVAILABLE',
                activeMeeting,
                pic: 'Admin Kantor',
                time: '10:00 AM'
            });

            saveDataAndSync();
            closeModal('roomModal');
        }

        function triggerScan() {
            alert('Modul Pemindaian QR Code Aktif.');
        }

        syncChannel.onmessage = (e) => {
            if (e.data.type === 'DATA_SYNC') {
                rooms = JSON.parse(localStorage.getItem('meeting_hub_rooms')) || defaultRooms;
                renderDashboard();
            }
        };

        // Render Awal
        renderDashboard();
    </script>
</body>
</html>
