name: Build Android APK Cloud Engine

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize & Install Dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Web Assets & Sync Capacitor
        run: |
          mkdir -p out
          if [ ! -f out/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Meeting Room</title></head><body><h1>Meeting Room App</h1></body></html>' > out/index.html
          fi

          # Backup custom AndroidManifest jika ada
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            mkdir -p /tmp/manifest_backup
            cp android/app/src/main/AndroidManifest.xml /tmp/manifest_backup/AndroidManifest.xml
          fi

          # Generasi ulang proyek Android lengkap jika gradlew belum tercipta
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi

          # Kembalikan custom AndroidManifest
          if [ -f /tmp/manifest_backup/AndroidManifest.xml ]; then
            mkdir -p android/app/src/main
            cp /tmp/manifest_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetingHub-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
